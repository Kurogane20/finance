version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: finance-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./data/finance.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - CORS_ORIGINS=http://localhost,http://localhost:80,https://${DOMAIN:-localhost}
    volumes:
      - backend-data:/app/data
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./frontend
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - finance-network

  # Nginx Reverse Proxy (optional - for advanced setup)
  # nginx:
  #   image: nginx:alpine
  #   container_name: finance-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  backend-data:
