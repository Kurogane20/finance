version: '3.8'

# ============================================
# PRODUCTION Docker Compose Configuration
# ============================================
# Usage: docker-compose -f docker-compose.prod.yml up -d --build
# Requires: .env file with production secrets

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_db}
      MYSQL_USER: ${MYSQL_USER:-finance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: finance-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-finance_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-finance_db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required for production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://finance.mitramutiara.co.id}
      - SEED_MODE=users_only
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Production build served by nginx)
  frontend:
    build: ./frontend
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  mysql-data:
